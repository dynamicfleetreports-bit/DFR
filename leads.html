<!DOCTYPE html>
<html lang="en"><head>
<script type="module" src="firebase-helper.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads | Dynamic Fleet Reporting</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#020617;--pan:#0f172a;--brd:rgba(255,255,255,.08);--grn:#10b981;--blu:#3b82f6;--gld:#f59e0b;--red:#ef4444;--txt:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.9rem 1rem;background:var(--pan);border-bottom:1px solid var(--brd);flex-wrap:wrap}
.top h1{font-size:18px;font-weight:900}.top small{color:var(--mut);font-size:12px}.top a{color:var(--mut);font-size:12px;text-decoration:none;margin-right:.6rem}
.wrap{max-width:900px;margin:0 auto;padding:1rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.8rem}
.st{background:var(--pan);border:1px solid var(--brd);border-radius:10px;padding:.6rem;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:10px;color:var(--mut);text-transform:uppercase}
.bar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
button,.btn{font-family:inherit;cursor:pointer;border:1px solid var(--brd);background:var(--pan);color:var(--txt);border-radius:8px;padding:.45rem .8rem;font-size:12px;font-weight:600}
button.on{border-color:var(--grn);color:var(--grn)}.g{background:var(--grn);border-color:var(--grn);color:#022c22}.r{border-color:var(--red);color:var(--red)}
input,select,textarea{width:100%;font-family:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--brd);border-radius:8px;padding:.5rem;font-size:13px}
textarea{min-height:60px}label{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;margin:.5rem 0 .2rem}
.row{display:flex;align-items:center;gap:.5rem;background:var(--pan);border:1px solid var(--brd);border-radius:10px;padding:.6rem .7rem;margin-bottom:.4rem;cursor:pointer}
.main{flex:1;min-width:0}.main b{display:block;font-size:14px}.main small{color:var(--mut);font-size:11px}
.pill{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(59,130,246,.15);color:#93c5fd;white-space:nowrap}
.own{font-size:11px;white-space:nowrap}.u{color:var(--grn)}.o{color:var(--gld)}
.warn{background:rgba(245,158,11,.15);color:var(--gld);font-size:10px;padding:2px 6px;border-radius:6px;white-space:nowrap}
.card{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.4);border-radius:10px;padding:.7rem;margin-bottom:.8rem;font-size:13px}
.card b{color:var(--gld)}.card div{margin-top:.3rem;cursor:pointer}
#bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;overflow:auto;padding:1rem}#bg.on{display:block}
#md{max-width:520px;margin:0 auto;background:var(--pan);border:1px solid var(--brd);border-radius:14px;padding:1rem}
.log{max-height:140px;overflow:auto;font-size:12px;border:1px solid var(--brd);border-radius:8px;padding:.4rem;margin-bottom:.4rem}.log div{margin-bottom:.35rem}.log i{color:var(--mut);font-style:normal;font-size:10px;display:block}
.ro{background:rgba(59,130,246,.1);border-radius:8px;padding:.5rem;font-size:12px;margin-bottom:.4rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--grn);color:#022c22;padding:.5rem 1rem;border-radius:8px;font-size:13px;font-weight:600;display:none;z-index:99}
@media(max-width:520px){.own{display:none}}
</style></head><body>
<div class="top"><div><h1>Leads</h1><small id="who">Loading...</small></div>
<div><a id="homeLink" href="index.html" style="display:none">Home</a><button onclick="document.getElementById('up').click()">Upload Excel/CSV</button> <button class="g" onclick="addModal()">+ Add lead</button></div></div>
<input type="file" id="up" accept=".xlsx,.xls,.csv" hidden onchange="importFile(this.files[0]);this.value=''">
<div class="wrap">
<div class="stats"><div class="st"><b id="s1">0</b><span>Total</span></div><div class="st"><b id="s2">0</b><span>Unclaimed</span></div><div class="st"><b id="s3">0</b><span>Mine</span></div><div class="st"><b id="s4">0</b><span>Converted</span></div></div>
<div id="warnCard"></div>
<div class="bar" id="flt"></div>
<input id="q" placeholder="Search company, town, contact, owner..." oninput="q=this.value.toLowerCase();render()" style="margin-bottom:.6rem">
<div id="list"></div></div>
<div id="bg"><div id="md"></div></div><div id="toast"></div>
<script>
const DAY=864e5, WARN=30, DROP=35;
const ST={new:'New',emailed:'Emailed',followup:'Follow-up',converted:'Converted'};
let me=null, leads=[], partners=[], filter='all', q='', openId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const wait=fn=>new Promise(r=>{const t=setInterval(()=>{if(fn()){clearInterval(t);r();}},60);});
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500);};
async function fresh(){return JSON.parse(await cloudStorage.getItem('FLEET_LEADS'))||[];}
// Every write re-reads the list first, applies one change, checks the save worked, then re-renders.
let emptyOk=false;
async function mutate(fn){
  const a=await fresh();
  if(!a.length&&leads.length){alert('Could not load the lead list - nothing was changed. Please refresh and try again.');return false;}
  const wasEmpty=!a.length, res=fn(a);
  if(res!==false){
    if(wasEmpty&&!emptyOk&&!confirm('The lead list looks empty. If it should not be, press Cancel and refresh. Continue?'))return false;
    emptyOk=true;
    const ok=await cloudStorage.setItem('FLEET_LEADS',JSON.stringify(a));
    if(!ok){alert('Save failed - your change was NOT saved. Check your connection or permissions.');leads=await fresh();render();return false;}
  }
  leads=a;render();return res!==false;
}
const lastAct=l=>{const t=[l.lastActivity,l.claimedAt,...(l.activityLog||[]).map(a=>Date.parse(a.date))].filter(x=>x&&!isNaN(x));return t.length?Math.max(...t):null;};
const idle=l=>{const t=lastAct(l);return t?(Date.now()-t)/DAY:0;};
const log=(l,note,by)=>{(l.activityLog=l.activityLog||[]).push({date:new Date().toISOString(),note,addedBy:by||me.name});l.lastActivity=Date.now();};
const canEdit=l=>me.admin||l.ownerId===me.id;
const daysLeft=l=>Math.max(1,Math.ceil(DROP-idle(l)));
const atRisk=l=>l.ownerId&&l.status!=='converted'&&idle(l)>=WARN;

document.addEventListener('DOMContentLoaded',async()=>{
  const p=new URLSearchParams(location.search), ref=p.get('ref')||p.get('pid');
  await wait(()=>typeof cloudStorage!=='undefined');
  partners=JSON.parse(await cloudStorage.getItem('REFERRAL_PARTNERS'))||[];
  if(ref){
    const rc=ref.startsWith('ref_')?ref:'ref_'+ref.replace(/\s+/g,'_');
    const pt=partners.find(x=>{const c='ref_'+x.name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');return c===rc||x.id===ref||c===ref;});
    if(!pt){document.body.innerHTML='<div style="padding:3rem;text-align:center"><h2>Partner link not recognised</h2><p style="color:#64748b;margin-top:.5rem">Please open this page from your Partner Portal.</p></div>';return;}
    me={id:pt.id,name:pt.name,admin:pt.principalRole==='owner'||pt.principalRole==='coowner'};
  }else{
    await window.dfrAuthReady.then(u=>{if(!u){location.href='login.html?next='+encodeURIComponent(location.pathname);throw 0;}});
    import('./auth-guard.js');
    me={id:'pieter',name:'Pieter Nell',admin:true};
  }
  $('who').textContent=me.name+(me.admin?' (Admin)':'');
  if(!ref)$('homeLink').style.display='inline';
  await mutate(a=>{let ch=false;a.forEach(l=>{
    if(l.ownerId&&!lastAct(l)){l.lastActivity=Date.now();ch=true;}
    if(l.ownerId&&l.status!=='converted'&&idle(l)>=DROP){const w=l.ownerName;log(l,'Returned to unclaimed automatically after '+DROP+' days without activity (was: '+w+')','System');l.ownerId='';l.ownerName='';ch=true;}
  });return ch;});
});

function render(){
  const mine=leads.filter(l=>l.ownerId===me.id);
  $('s1').textContent=leads.length;$('s2').textContent=leads.filter(l=>!l.ownerId).length;$('s3').textContent=mine.length;$('s4').textContent=leads.filter(l=>l.status==='converted').length;
  try{localStorage.setItem('dfr_leads_total',leads.length);localStorage.setItem('dfr_leads_new',leads.filter(l=>l.status==='new').length);}catch(e){}
  const risk=mine.filter(atRisk);
  $('warnCard').innerHTML=risk.length?'<div class="card"><b>Your leads are about to return to unclaimed</b><br>No activity for '+WARN+'+ days. Log an update to keep them.'+risk.map(l=>'<div onclick="openLead(\''+l.id+'\')">'+esc(l.company)+' - returns in '+daysLeft(l)+' day(s)</div>').join('')+'</div>':'';
  $('flt').innerHTML=[['all','All'],['unclaimed','Unclaimed'],['mine','Mine'],['taken','Taken by others']].map(f=>'<button class="'+(filter===f[0]?'on':'')+'" onclick="filter=\''+f[0]+'\';render()">'+f[1]+'</button>').join('');
  let rows=leads.filter(l=>filter==='all'||(filter==='unclaimed'&&!l.ownerId)||(filter==='mine'&&l.ownerId===me.id)||(filter==='taken'&&l.ownerId&&l.ownerId!==me.id));
  if(q)rows=rows.filter(l=>[l.company,l.location,l.sector,l.contactName,l.contactEmail,l.ownerName].join(' ').toLowerCase().includes(q));
  rows.sort((a,b)=>(!a.ownerId===!b.ownerId?0:!a.ownerId?-1:1)||(a.company||'').localeCompare(b.company||''));
  $('list').innerHTML=rows.length?rows.map(l=>'<div class="row" onclick="openLead(\''+l.id+'\')"><div class="main"><b>'+esc(l.company)+'</b><small>'+esc([l.location||l.sector,l.phone].filter(Boolean).join(' - '))+'</small></div>'
    +(atRisk(l)?'<span class="warn">'+daysLeft(l)+'d left</span>':'')+'<span class="pill">'+(ST[l.status]||'New')+'</span>'
    +'<span class="own '+(l.ownerId?'o':'u')+'">'+(l.ownerId?esc(l.ownerName):'Unclaimed')+'</span>'
    +(l.ownerId?'':'<button class="g" onclick="event.stopPropagation();claim(\''+l.id+'\')">Claim</button>')+'</div>').join(''):'<p style="color:var(--mut);text-align:center;padding:2rem">No leads here.</p>';
}

async function claim(id){
  let ok=false;
  await mutate(a=>{const l=a.find(x=>x.id===id);if(!l||l.ownerId)return false;l.ownerId=me.id;l.ownerName=me.name;l.claimedAt=Date.now();log(l,'Claimed by '+me.name);ok=true;});
  if(ok){toast('Claimed - it is now on your name');if(openId===id)openLead(id);}else alert('Someone else claimed this lead first.');
}
async function surrender(id){
  const why=prompt('Why are you surrendering this lead? (e.g. could not get through)');
  if(!why||!why.trim())return;
  const ok=await mutate(a=>{const l=a.find(x=>x.id===id);if(!l||(!me.admin&&l.ownerId!==me.id))return false;log(l,'Surrendered by '+l.ownerName+': '+why.trim());l.ownerId='';l.ownerName='';});
  if(ok){closeModal();toast('Lead is back on the list for someone else');}
}
async function reassign(id,pid){
  const pt=pid==='pieter'?{id:'pieter',name:'Pieter Nell'}:partners.find(x=>x.id===pid);
  await mutate(a=>{const l=a.find(x=>x.id===id);if(!l)return false;if(!pt){log(l,'Released to unclaimed by admin '+me.name);l.ownerId='';l.ownerName='';}else{l.ownerId=pt.id;l.ownerName=pt.name;l.claimedAt=Date.now();log(l,'Reassigned to '+pt.name+' by admin '+me.name);}});
  openLead(id);
}
async function addNote(id){
  const n=$('d-note').value.trim();if(!n)return;
  await mutate(a=>{const l=a.find(x=>x.id===id);if(!l||!(me.admin||l.ownerId===me.id))return false;log(l,n);});openLead(id);
}
async function saveLead(id){
  const v=k=>$('d-'+k).value.trim();
  await mutate(a=>{const l=a.find(x=>x.id===id);if(!l||!(me.admin||l.ownerId===me.id))return false;
    if(v('status')!==l.status)log(l,'Status changed to '+ST[v('status')]);
    Object.assign(l,{contactName:v('contactName'),contactEmail:v('contactEmail'),phone:v('phone'),notes:v('notes'),status:v('status'),lastActivity:Date.now()});});
  closeModal();
}
function openLead(id){
  const l=leads.find(x=>x.id===id);if(!l)return;openId=id;const ed=canEdit(l),d=ed?'':'disabled';
  const wa=(String(l.phone||'').replace(/\D/g,'')).replace(/^0/,'27');
  const msg=encodeURIComponent("Hi, I run Dynamic Fleet Reporting - we audit transport fleets' fuel logs and break down exactly where fuel is being lost (idle time, speeding, driving inefficiency), no hardware required. I'd like to offer "+l.company+" a free audit on your own data to show you the numbers. Could someone from your fleet/operations team get in touch? Thanks, "+me.name);
  const hist=(l.activityLog||[]).slice().reverse().map(a=>'<div><i>'+new Date(a.date).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'})+' - '+esc(a.addedBy||'')+'</i>'+esc(a.note)+'</div>').join('')||'<div style="color:var(--mut)">No activity yet.</div>';
  $('md').innerHTML='<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">'+esc(l.company)+'</h2><button onclick="closeModal()">X</button></div>'
   +'<small style="color:var(--mut)">'+esc([l.location,l.sector,l.website].filter(Boolean).join(' - '))+'</small>'
   +(l.ownerId?'<div class="ro">Working: <b>'+esc(l.ownerName)+'</b>'+(atRisk(l)?' - returns to unclaimed in '+daysLeft(l)+' day(s) without activity':'')+(ed?'':' (view only)')+'</div>':'<div class="ro">Unclaimed - <button class="g" onclick="claim(\''+id+'\')">Claim this lead</button></div>')
   +'<label>Contact name</label><input id="d-contactName" value="'+esc(l.contactName)+'" '+d+'><label>Email</label><input id="d-contactEmail" value="'+esc(l.contactEmail)+'" '+d+'><label>Phone</label><input id="d-phone" value="'+esc(l.phone)+'" '+d+'>'
   +'<label>Status</label><select id="d-status" '+d+'>'+Object.keys(ST).map(s=>'<option value="'+s+'" '+(l.status===s?'selected':'')+'>'+ST[s]+'</option>').join('')+'</select>'
   +'<label>Notes</label><textarea id="d-notes" '+d+'>'+esc(l.notes)+'</textarea>'
   +'<div style="margin:.5rem 0;display:flex;gap:.4rem;flex-wrap:wrap">'+(l.contactEmail?'<a class="btn" href="mailto:'+esc(l.contactEmail)+'?subject='+encodeURIComponent('Free fuel audit for '+l.company)+'&body='+msg+'">Email</a>':'')+(wa?'<a class="btn" target="_blank" href="https://wa.me/'+wa+'?text='+msg+'">WhatsApp</a>':'')+'</div>'
   +'<label>Activity history</label><div class="log">'+hist+'</div>'
   +(ed?'<input id="d-note" placeholder="Log an update, e.g. Called, left message"><button style="width:100%;margin:.3rem 0" onclick="addNote(\''+id+'\')">+ Add note</button><button class="g" style="width:100%" onclick="saveLead(\''+id+'\')">Save changes</button>'
     +(l.ownerId?'<button class="r" style="width:100%;margin-top:.4rem" onclick="surrender(\''+id+'\')">Surrender this lead</button>':''):'')
   +(me.admin?'<label>Admin: reassign</label><select onchange="reassign(\''+id+'\',this.value)"><option value="">Unclaimed</option><option value="pieter" '+(l.ownerId==='pieter'?'selected':'')+'>Pieter Nell</option>'+partners.map(x=>'<option value="'+esc(x.id)+'" '+(l.ownerId===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>':'');
  $('bg').classList.add('on');
}
function closeModal(){$('bg').classList.remove('on');openId=null;}
$('bg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function addModal(){
  $('md').innerHTML='<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">Add a lead</h2><button onclick="closeModal()">X</button></div>'
   +['company:Company name *','sector:Sector / fleet notes','location:Town / area','contactName:Contact name','contactEmail:Email','phone:Phone'].map(f=>'<label>'+f.split(':')[1]+'</label><input id="a-'+f.split(':')[0]+'">').join('')
   +'<label>Notes</label><textarea id="a-notes"></textarea><label style="text-transform:none;font-size:13px;color:var(--txt)"><input type="checkbox" id="a-claim" checked style="width:auto"> Claim it now (put it on my name)</label>'
   +'<button class="g" style="width:100%;margin-top:.6rem" onclick="saveNew()">Add lead</button>';
  $('bg').classList.add('on');
}
async function saveNew(){
  const v=k=>$('a-'+k).value.trim(), co=v('company');if(!co){alert('Company name is required.');return;}
  if(leads.some(l=>norm(l.company)===norm(co))&&!confirm(co+' is already on the list. Add it anyway?'))return;
  const claimIt=$('a-claim').checked;
  await mutate(a=>{const l={id:'lead_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),company:co,sector:v('sector'),location:v('location'),contactName:v('contactName'),contactEmail:v('contactEmail'),phone:v('phone'),notes:v('notes'),tier:'small',source:'Manual',status:'new',createdAt:Date.now(),ownerId:'',ownerName:'',activityLog:[]};
    if(claimIt){l.ownerId=me.id;l.ownerName=me.name;l.claimedAt=Date.now();}log(l,'Added'+(claimIt?' and claimed':'')+' by '+me.name);a.push(l);});
  closeModal();toast('Lead added');
}

async function importFile(f){
  if(!f)return;
  let rows;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}catch(e){alert('Could not read that file.');return;}
  const pick=(r,keys,ex)=>{for(const k of Object.keys(r)){const kn=k.toLowerCase();if(ex&&kn.includes(ex))continue;if(keys.some(x=>kn.includes(x))&&String(r[k]).trim())return String(r[k]).trim();}return '';};
  let added=0,dup=0;
  await mutate(a=>{
    const seen=new Set(a.map(l=>norm(l.company))),mails=new Set(a.map(l=>(l.contactEmail||'').toLowerCase()).filter(Boolean));
    rows.forEach(r=>{
      const co=pick(r,['company','business'])||pick(r,['name'],'contact');if(!co)return;
      const em=pick(r,['email','e-mail']).toLowerCase();
      if(seen.has(norm(co))||(em&&mails.has(em))){dup++;return;}
      seen.add(norm(co));if(em)mails.add(em);
      const s=pick(r,['status'],'linkedin').toLowerCase();
      const st=/bounce|not sent|not approached/.test(s)?'new':/follow/.test(s)?'followup':/sent|deliver|email/.test(s)?'emailed':'new';
      const l={id:'lead_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),company:co,sector:pick(r,['sector','industry','type']),location:pick(r,['location','address','city','town','area']),
        contactName:pick(r,['contact','person'],'mail'),contactEmail:em,phone:pick(r,['phone','tel','cell','mobile']),website:pick(r,['website','web','url']),notes:pick(r,['note']),
        tier:'small',source:'Upload: '+f.name,status:st,createdAt:Date.now(),ownerId:'',ownerName:'',activityLog:[]};
      if(st!=='new'){l.ownerId=me.id;l.ownerName=me.name;l.claimedAt=Date.now();}
      log(l,'Imported from '+f.name+(st!=='new'?' (already contacted, placed on '+me.name+')':''));a.push(l);added++;
    });
    return added>0;
  });
  toast('Imported '+added+' new lead(s), skipped '+dup+' already on the list');
}
</script></body></html>
